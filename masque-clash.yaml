mode: rule
allow-lan: true
mixed-port: 7890
bind-address: '*'
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: info
global-ua: clash.meta

geodata-mode: true
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
geo-auto-update: true
geo-update-interval: 24

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - geosite:private
    - geosite:category-ir
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - localhost
  use-hosts: true
  respect-rules: true
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  nameserver-policy:
    "geosite:category-ir":
      - system
    "geosite:geolocation-!cn":
      - https://cloudflare-dns.com/dns-query#proxy=Proxy-Select
      - https://dns.google/dns-query#proxy=Proxy-Select
  proxy-server-nameserver:
    - system
    - 1.1.1.1

